apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgres-cnpg
  namespace: crossplane-system
  labels:
    provider: cnpg
    revision: "61"
spec:
  # Reference to the XRD
  compositeTypeRef:
    apiVersion: dip.io/v1alpha1
    kind: Postgres
  
  mode: Pipeline

  pipeline:
  # Load environment configurations for AWS account, region, and cluster info
  - step: load-environment-configs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Selector
          selector:
            mode: Multiple
            matchLabels:
              - key: config
                type: Value
                value: dip-software

  # Render CNPG resources
  - step: render-resources
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource }}
          {{- $namespace := $xr.metadata.namespace }}
          {{- $name := $xr.metadata.name }}

          {{- /* Environment Config Values */ -}}
          {{- $env := index .context "apiextensions.crossplane.io/environment" | default dict }}
          {{- $awsAccountId := index $env "accountId" | default "" }}
          {{- $awsRegion := index $env "region" | default "eu-west-2" }}
          {{- $resourcePrefix := index $env "resourcePrefix" | default "" }}
          {{- $bootstrap := index $env "bootstrap" | default dict }}
          {{- $oidcProvider := index $bootstrap "oidcProvider" | default (index $env "oidcProvider" | default "") }}
          {{- $oidcProviderArn := index $bootstrap "oidcProviderArn" | default (index $env "oidcProviderArn" | default "") }}

          {{- /* T-Shirt Sizing Map */ -}}
          {{- $size := $xr.spec.parameters.size | default "small" }}
          
          {{- /* Restore Configuration */ -}}
          {{- $restoreIdentifier := "" }}
          {{- $restoreMethod := "backup" }}
          {{- $restoreTargetTime := "" }}
          {{- if $xr.spec.parameters.restore }}
            {{- $restoreIdentifier = $xr.spec.parameters.restore.sourceIdentifier | default "" }}
            {{- $restoreMethod = $xr.spec.parameters.restore.method | default "backup" }}
            {{- $restoreTargetTime = $xr.spec.parameters.restore.targetTime | default "" }}
          {{- end }}
          
          {{- /* Identifier logic */ -}}
          {{- $targetIdentifier := $xr.spec.parameters.identifier | default "" }}
          
          {{- $dbAllocatedStorage := $xr.spec.parameters.allocatedStorage | default 20 }}
          {{- $dbStorageType := $xr.spec.parameters.storageType | default "gp3" }}
          {{- $dbMultiAz := $xr.spec.parameters.multiAz | default false }}
          {{- $databaseName := $xr.spec.parameters.databaseName | default "" }}
          {{- $enableSnapshots := $xr.spec.parameters.enableSnapshots | default false }}
          {{- $snapshotClassName := $xr.spec.parameters.snapshotClassName | default "default" }}
          {{- $storageClassName := $xr.spec.parameters.storageClassName | default "" }}

          {{- /* VPA Configuration */ -}}
          {{- $vpaEnabled := false }}
          {{- $vpaUpdateMode := "Off" }}
          {{- if $xr.spec.parameters.vpa }}
            {{- $vpaEnabled = $xr.spec.parameters.vpa.enabled | default false }}
            {{- $vpaUpdateMode = $xr.spec.parameters.vpa.updateMode | default "Off" }}
          {{- end }}

          {{- /* Barman Backup Configuration */ -}}
          {{- $barmanEnabled := false }}
          {{- $barmanBucketName := printf "%s-barman" $resourcePrefix }}
          {{- $barmanBucketPrefix := printf "%s/%s" $namespace $targetIdentifier }}
          {{- $barmanRetentionDays := 7 }}
          {{- $barmanCompression := "gzip" }}
          {{- $barmanSchedule := "0 0 0 * * *" }}
          {{- if $xr.spec.parameters.barmanBackup }}
            {{- $barmanEnabled = $xr.spec.parameters.barmanBackup.enabled | default false }}
            {{- if $xr.spec.parameters.barmanBackup.bucketName }}
              {{- $barmanBucketName = $xr.spec.parameters.barmanBackup.bucketName }}
            {{- end }}
            {{- if $xr.spec.parameters.barmanBackup.bucketPrefix }}
              {{- $barmanBucketPrefix = $xr.spec.parameters.barmanBackup.bucketPrefix }}
            {{- end }}
            {{- $barmanRetentionDays = $xr.spec.parameters.barmanBackup.retentionDays | default 7 }}
            {{- $barmanCompression = $xr.spec.parameters.barmanBackup.compression | default "gzip" }}
            {{- $barmanSchedule = $xr.spec.parameters.barmanBackup.scheduleBaseBackup | default "0 0 0 * * *" }}
          {{- end }}
          {{- $barmanDestinationPath := printf "s3://%s/%s" $barmanBucketName $barmanBucketPrefix }}
          {{- /* Skip barman backup config during recovery from barman - the destination is the recovery source */ -}}
          {{- $skipBarmanBackup := and (eq $restoreMethod "barmanObjectStore") $barmanEnabled }}

          {{- $dbMasterUsername := $xr.spec.parameters.masterUsername | default "" }}
          
          {{- /* Password Handling */ -}}
          {{- $dbMasterPasswordSecretName := "" }}
          {{- $dbMasterPasswordSecretKey := "password" }}
          {{- $generatedPassword := "" }}

          {{- if $xr.spec.parameters.masterPasswordSecretRef }}
             {{- $dbMasterPasswordSecretName = $xr.spec.parameters.masterPasswordSecretRef.name }}
             {{- $dbMasterPasswordSecretKey = $xr.spec.parameters.masterPasswordSecretRef.key | default "password" }}
          {{- else }}
             {{- $dbMasterPasswordSecretName = printf "%s-password" $name }}
             {{- /* Check if secret already exists to preserve password */ -}}
             {{- $observedResources := .observed.resources | default dict }}
             {{- $existingSecret := index $observedResources "password-secret" }}
             {{- if $existingSecret }}
               {{- $generatedPassword = index $existingSecret.resource.data "password" | b64dec }}
             {{- else }}
               {{- $generatedPassword = randAlphaNum 24 }}
             {{- end }}
          {{ end }} 
          
          {{- $dbMasterPasswordSecret := dict "name" $dbMasterPasswordSecretName "key" $dbMasterPasswordSecretKey }}
          {{- $dbPort := $xr.spec.parameters.port | default 5432 }}

          {{- /* Secret Name Logic - Always created */ -}}
          {{- $secretName := printf "%s-connection" $name }}
          {{- if $xr.spec.writeConnectionSecretToRef }}
            {{- $secretName = $xr.spec.writeConnectionSecretToRef.name }}
          {{- end }}
          
          {{- /* CNPG Resource Calculation - CPU limits intentionally omitted */ -}}
          {{- $cnpgCpuReq := "50m" }}
          {{- $cnpgMemReq := "128Mi" }}
          {{- $cnpgMemLim := "1Gi" }}
          {{- if eq $size "xsmall" }}
            {{- $cnpgCpuReq = "25m" }}
            {{- $cnpgMemReq = "64Mi" }}
            {{- $cnpgMemLim = "256Mi" }}
          {{- else if eq $size "medium" }}
            {{- $cnpgCpuReq = "250m" }}
            {{- $cnpgMemReq = "1Gi" }}
            {{- $cnpgMemLim = "4Gi" }}
          {{- else if eq $size "large" }}
            {{- $cnpgCpuReq = "1" }}
            {{- $cnpgMemReq = "4Gi" }}
            {{- $cnpgMemLim = "16Gi" }}
          {{- end }}
          
          {{- $cnpgInstances := 2 }}
          {{- if $dbMultiAz }}
            {{- $cnpgInstances = 3 }}
          {{- end }}
          
          ---
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: {{ $targetIdentifier }}
            namespace: {{ $namespace }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: database
              crossplane.io/composition-resource-name: database
              crossplane.io/external-name: {{ $targetIdentifier }}
          spec:
            instances: {{ $cnpgInstances }}

            {{- if $barmanEnabled }}
            # Service account with IRSA annotation for S3 access
            serviceAccountTemplate:
              metadata:
                annotations:
                  eks.amazonaws.com/role-arn: arn:aws:iam::{{ $awsAccountId }}:role/{{ $namespace }}-{{ $targetIdentifier }}-cnpg-backup
            {{- end }}

            {{- if and $barmanEnabled (not $skipBarmanBackup) }}
            # isWALArchiver: true is required here - without it CNPG still
            # turns on archive_mode (driven by backup.volumeSnapshot's
            # waitForArchive below, which needs continuous archiving to
            # exist), but has no active archiver to send WAL to. Every
            # archive attempt then fails forever and WAL never gets
            # recycled, silently filling the PV. This plugin is only ever
            # registered when barman S3 backup is enabled, so it should
            # always be the WAL archiver - there is no case in this
            # composition where the plugin is present but shouldn't be.
            plugins:
              - name: barman-cloud.cloudnative-pg.io
                isWALArchiver: true
                parameters:
                  barmanObjectName: {{ $targetIdentifier }}-backup
            {{- end }}

            # Bootstrap configuration
            bootstrap:
              {{- if eq $restoreMethod "barmanObjectStore" }}
              recovery:
                source: barmanBackupSource
                {{- if $restoreTargetTime }}
                recoveryTarget:
                  targetTime: {{ $restoreTargetTime | quote }}
                {{- end }}
              {{- else if $restoreIdentifier }}
              recovery:
                {{- if eq $restoreMethod "volumeSnapshot" }}
                volumeSnapshots:
                  storage:
                    name: {{ $restoreIdentifier }}
                    kind: VolumeSnapshot
                    apiGroup: snapshot.storage.k8s.io
                {{- else }}
                backup:
                  name: {{ $restoreIdentifier }}
                {{- end }}
              {{- else }}
              initdb:
                database: {{ $databaseName | default "app" }}
                owner: {{ $dbMasterUsername | default "app" }}
                secret:
                  name: {{ $dbMasterPasswordSecret.name }}
              {{- end }}

            {{- if eq $restoreMethod "barmanObjectStore" }}
            # External cluster for barman recovery source
            externalClusters:
            - name: barmanBackupSource
              plugin:
                name: barman-cloud.cloudnative-pg.io
                parameters:
                  barmanObjectName: {{ $targetIdentifier }}-backup
                  serverName: {{ $targetIdentifier }}
            {{- end }}

            enableSuperuserAccess: true

            # Storage configuration
            storage:
              size: {{ $dbAllocatedStorage }}Gi
              {{- if $storageClassName }}
              storageClass: {{ $storageClassName }}
              {{- end }}

            # Resource Requirements (no CPU limits - allows bursting)
            resources:
              requests:
                memory: {{ $cnpgMemReq }}
                cpu: {{ $cnpgCpuReq }}
              limits:
                memory: {{ $cnpgMemLim }}

            {{- if $enableSnapshots }}
            backup:
              volumeSnapshot:
                className: {{ $snapshotClassName }}
                {{- if and $barmanEnabled (not $skipBarmanBackup) }}
                online: true
                onlineConfiguration:
                  immediateCheckpoint: false
                  waitForArchive: true
                {{- end }}
              target: prefer-standby
            {{- end }}
          
          {{- /* Password Secret - Always created (stub if user provided) */ -}}
          {{- $pwSecretName := printf "%s-password" $name }}
          {{- if $xr.spec.parameters.masterPasswordSecretRef }}
             {{- $pwSecretName = printf "%s-password-stub" $name }}
          {{- end }}

          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ $pwSecretName }}
            namespace: {{ $namespace }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: password-secret
          type: Opaque
          data:
             {{- if not $xr.spec.parameters.masterPasswordSecretRef }}
             username: {{ $dbMasterUsername | default "app" | b64enc }}
             password: {{ $generatedPassword | b64enc }}
             {{- else }}
             stub: {{ "true" | b64enc }}
             {{- end }}
          

          
          {{- $fqdn := printf "%s-rw.%s.svc" $targetIdentifier $namespace }}
          
          ---
          # Superuser Secret (Required for postgres user consistency)
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ $targetIdentifier }}-superuser
            namespace: {{ $namespace }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: superuser-secret
              cnpg.io/userType: superuser
              cnpg.io/cluster: {{ $targetIdentifier }}
          type: kubernetes.io/basic-auth
          data:
             username: {{ "postgres" | b64enc }}
             {{- if not $xr.spec.parameters.masterPasswordSecretRef }}
             password: {{ $generatedPassword | b64enc }}
             {{- else }}
             stub: {{ "true" | b64enc }}
             {{- end }}

          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ $secretName }}
            namespace: {{ $namespace }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: connection-secret
          type: Opaque
          data:
            endpoint: {{ printf "%s:%d" $fqdn (int $dbPort) | b64enc }}
            host: {{ $fqdn | b64enc }}
            port: {{ printf "%d" (int $dbPort) | b64enc }}
            username: {{ $dbMasterUsername | default "app" | b64enc }}
            database: {{ $databaseName | default "app" | b64enc }}
            sslmode: {{ "require" | b64enc }}
            {{- if $generatedPassword }}
            password: {{ $generatedPassword | b64enc }}
            {{- /* Only buildable when we generated the password ourselves - with
                   masterPasswordSecretRef the password lives in an external
                   Secret we never read, so there is nothing to compose here. */}}
            url: {{ printf "postgresql://%s:%s@%s:%d/%s?sslmode=require" ($dbMasterUsername | default "app") $generatedPassword $fqdn (int $dbPort) ($databaseName | default "app") | b64enc }}
            {{- end }}

          {{- if $enableSnapshots }}
          ---
          apiVersion: postgresql.cnpg.io/v1
          kind: ScheduledBackup
          metadata:
            name: {{ $name }}-scheduled-backup
            namespace: {{ $namespace }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: scheduled-backup
              # CNPG ScheduledBackup has no status.conditions, so function-auto-ready
              # would never mark it ready. Declare readiness here (rather than via
              # patch-and-transform, which fatally errors when this resource is not
              # rendered — e.g. enableSnapshots/barman disabled).
              gotemplating.fn.crossplane.io/ready: "True"
          spec:
            schedule: "0 0 0 * * *"
            method: volumeSnapshot
            backupOwnerReference: self
            cluster:
              name: {{ $targetIdentifier }}
          {{- end }}

          {{- if and $barmanEnabled (not $skipBarmanBackup) }}
          ---
          apiVersion: postgresql.cnpg.io/v1
          kind: ScheduledBackup
          metadata:
            name: {{ $name }}-barman-backup
            namespace: {{ $namespace }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: barman-scheduled-backup
              gotemplating.fn.crossplane.io/ready: "True"
          spec:
            schedule: {{ $barmanSchedule | quote }}
            method: plugin
            pluginConfiguration:
              name: barman-cloud.cloudnative-pg.io
              parameters:
                barmanObjectName: {{ $targetIdentifier }}-backup
            backupOwnerReference: self
            cluster:
              name: {{ $targetIdentifier }}
          {{- end }}

          {{- if $vpaEnabled }}
          ---
          apiVersion: autoscaling.k8s.io/v1
          kind: VerticalPodAutoscaler
          metadata:
            name: {{ $targetIdentifier }}-vpa
            namespace: {{ $namespace }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: vpa
          spec:
            targetRef:
              apiVersion: postgresql.cnpg.io/v1
              kind: Cluster
              name: {{ $targetIdentifier }}
            updatePolicy:
              updateMode: {{ $vpaUpdateMode | quote }}
            resourcePolicy:
              containerPolicies:
              - containerName: postgres
                minAllowed:
                  memory: 64Mi
                  cpu: 50m
                maxAllowed:
                  memory: 8Gi
                  cpu: 4
                controlledResources: ["memory", "cpu"]
          {{- end }}

          {{- if and $barmanEnabled (not $skipBarmanBackup) }}
          ---
          apiVersion: barmancloud.cnpg.io/v1
          kind: ObjectStore
          metadata:
            name: {{ $targetIdentifier }}-backup
            namespace: {{ $namespace }}
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: barman-objectstore
              gotemplating.fn.crossplane.io/ready: "True"
          spec:
            configuration:
              destinationPath: {{ $barmanDestinationPath }}
              s3Credentials:
                inheritFromIAMRole: true
              wal:
                compression: {{ $barmanCompression }}
                maxParallel: 4
              data:
                compression: {{ $barmanCompression }}
            retentionPolicy: "{{ $barmanRetentionDays }}d"
          {{- end }}

          {{- if $barmanEnabled }}
          ---
          # IAM Role for CNPG backup to S3 via IRSA
          # Uses wildcard trust to allow any postgres service account in this namespace
          apiVersion: iam.aws.m.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $name }}-cnpg-backup-role
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cnpg-backup-iam-role
              crossplane.io/external-name: {{ $namespace }}-{{ $targetIdentifier }}-cnpg-backup
          spec:
            forProvider:
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Federated": "{{ $oidcProviderArn }}"
                      },
                      "Action": "sts:AssumeRoleWithWebIdentity",
                      "Condition": {
                        "StringLike": {
                          "{{ $oidcProvider }}:sub": "system:serviceaccount:{{ $namespace }}:{{ $targetIdentifier }}",
                          "{{ $oidcProvider }}:aud": "sts.amazonaws.com"
                        }
                      }
                    }
                  ]
                }
              tags:
                ManagedBy: Crossplane
                Namespace: {{ $namespace }}
                Cluster: {{ $targetIdentifier }}
                Purpose: CNPG-Barman-Backup
            providerConfigRef:
              name: default
              kind: ClusterProviderConfig

          ---
          # IAM Policy for S3 access to barman bucket
          apiVersion: iam.aws.m.upbound.io/v1beta1
          kind: Policy
          metadata:
            name: {{ $name }}-cnpg-backup-policy
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cnpg-backup-iam-policy
              crossplane.io/external-name: {{ $namespace }}-{{ $targetIdentifier }}-cnpg-backup
          spec:
            forProvider:
              policy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Sid": "AllowBarmanS3Access",
                      "Effect": "Allow",
                      "Action": [
                        "s3:GetObject",
                        "s3:PutObject",
                        "s3:DeleteObject",
                        "s3:ListBucket",
                        "s3:GetBucketLocation"
                      ],
                      "Resource": [
                        "arn:aws:s3:::{{ $barmanBucketName }}",
                        "arn:aws:s3:::{{ $barmanBucketName }}/{{ $namespace }}/*"
                      ]
                    }
                  ]
                }
              tags:
                ManagedBy: Crossplane
                Namespace: {{ $namespace }}
                Cluster: {{ $targetIdentifier }}
                Purpose: CNPG-Barman-Backup
            providerConfigRef:
              name: default
              kind: ClusterProviderConfig

          ---
          # Attach policy to role
          apiVersion: iam.aws.m.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $name }}-cnpg-backup-attachment
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: cnpg-backup-iam-attachment
          spec:
            forProvider:
              policyArnRef:
                name: {{ $name }}-cnpg-backup-policy
              roleRef:
                name: {{ $name }}-cnpg-backup-role
            providerConfigRef:
              name: default
              kind: ClusterProviderConfig
          {{- end }}

  # Patch status fields
  - step: patch-and-transform
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      - name: database
        patches:
        - type: ToCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: status.dbInstanceIdentifier
        - type: ToCompositeFieldPath
          fromFieldPath: status.writeService
          toFieldPath: status.dbEndpoint
        readinessChecks:
        # CNPG Readiness
        - fieldPath: status.phase
          matchString: "Cluster in healthy state"
          type: MatchString
      
      - name: password-secret
        readinessChecks:
        - type: MatchString
          fieldPath: kind
          matchString: Secret

      - name: connection-secret
        readinessChecks:
        - type: MatchString
          fieldPath: kind
          matchString: Secret

      - name: superuser-secret
        readinessChecks:
        - type: MatchString
          fieldPath: kind
          matchString: Secret

      # NOTE: backup resources (scheduled-backup, barman-scheduled-backup,
      # barman-objectstore) are intentionally NOT listed here. They are rendered
      # conditionally by the go-templating step, and patch-and-transform fatally
      # errors on any named resource that has no base and was not produced upstream
      # (i.e. when those backups are disabled). Their readiness is instead declared
      # inline via the gotemplating.fn.crossplane.io/ready annotation.

  # Auto-ready function
  - step: auto-ready
    functionRef:
      name: function-auto-ready
