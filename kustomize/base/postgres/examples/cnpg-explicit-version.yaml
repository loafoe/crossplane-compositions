apiVersion: dip.io/v1alpha1
kind: Postgres
metadata:
  name: myapp-pinned-db
  namespace: default
spec:
  writeConnectionSecretToRef:
    name: myapp-pinned-db-connection
    namespace: default
  crossplane:
    compositionSelector:
      matchLabels:
        provider: cnpg
  parameters:
    size: small
    masterUsername: "postgres"
    identifier: myapp-pinned
    databaseName: app

    # The only example that sets engineVersion explicitly. For CNPG this is
    # rendered as spec.imageName on the Cluster:
    #   ghcr.io/cloudnative-pg/postgresql:<engineVersion>-system-trixie
    # When omitted (as in every other example) this defaults to 18.6, the
    # version shipped by the deployed operator (1.30.1). Pin a different
    # supported version here if a workload needs one - e.g. "17.8".
    engineVersion: "18.6"

    allocatedStorage: 5
    multiAz: false
